
Есть команда app.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///users.db'
1. Как записать команду с абсолютным path
2. Как записать команду с на родительский path (на уровень вверх)
3. Как записать команду с дочерним path


Для настройки `SQLALCHEMY_DATABASE_URI` с использованием абсолютного, родительского и дочернего пути в вашем приложении Flask, вы можете использовать модуль `os` для работы с путями. Вот примеры для каждого случая:

1. **Абсолютный путь**:
   ```python
   import os

   app.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///' + os.path.abspath('/absolute/path/to/your/users.db')
   ```

   Замените `'/absolute/path/to/your/users.db'` на необходимый вам абсолютный путь.

2. **Родительский путь (на уровень вверх)**:
   ```python
   import os

   app.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///' + os.path.abspath(os.path.join(os.path.dirname(__file__), '..', 'users.db'))
   ```

   Здесь `os.path.dirname(__file__)` возвращает путь к текущему файлу, а `os.path.join(..., '..', 'users.db')` поднимает на уровень вверх и добавляет имя файла базы данных.

3. **Дочерний путь**:
   ```python
   import os

   app.config['SQLALCHEMY_DATABASE_URI'] = 'sqlite:///' + os.path.abspath(os.path.join(os.path.dirname(__file__), 'subdir', 'users.db'))
   ```

   В этом случае `subdir` — это имя подкаталога, в котором находится файл `users.db`. Замените его на нужное вам имя дочернего каталога.

Эти примеры помогут вам правильно указать путь к базе данных в зависимости от вашей структуры проекта.
Bootstrap предлагает множество классов для управления отступами (margin и padding) и выравниванием элементов. Вот основные классы, которые помогут вам сделать страницы аккуратными и современными.

### Управление отступами

Bootstrap предоставляет классы для изменения отступов. Классы имеют следующий формат: `m{t|r|b|l|x|y|a}-{breakpoint}-{size}`, где:

- `m` — для margin (отступа);
- `p` — для padding (внутреннего отступа);
- `{t|r|b|l|x|y|a}` — сторона:
  - `t` — сверху (top)
  - `r` — справа (right)
  - `b` — снизу (bottom)
  - `l` — слева (left)
  - `x` — горизонтально (left и right)
  - `y` — вертикально (top и bottom)
  - `a` — для всех сторон (all)
- `{breakpoint}` — (необязательно) для указания точки останова, например, `sm`, `md`, `lg`, `xl`, `xxl`;
- `{size}` — размер отступа (от 0 до 5, где 0 - без отступа, 1 - маленький отступ, 5 - большой отступ).

#### Примеры:

```html
<div class="m-3">Отступ 3 со всех сторон</div>
<div class="mt-2">Отступ сверху 2</div>
<div class="px-4">Горизонтальный внутренний отступ 4</div>
<div class="pb-5">Нижний внутренний отступ 5</div>
```

### Управление выравниванием

Bootstrap также предлагает классы для выравнивания текста и элементов. Вот несколько полезных классов:

#### Выравнивание текста

- `text-start` — выравнивание по левому краю
- `text-center` — выравнивание по центру
- `text-end` — выравнивание по правому краю

##### Пример:

```html
<p class="text-center">Текст по центру</p>
```

#### Выравнивание блоков

- `d-flex` — включает флекс-контейнер
- `justify-content-start` — выравнивание по левому краю
- `justify-content-center` — выравнивание по центру
- `justify-content-end` — выравнивание по правому краю
- `align-items-start` — выравнивание по верхнему краю
- `align-items-center` — выравнивание по центру по вертикали
- `align-items-end` — выравнивание по нижнему краю

